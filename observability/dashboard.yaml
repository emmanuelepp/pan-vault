apiVersion: v1
kind: ConfigMap
metadata:
  name: pan-vault-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  pan-vault.json: |
    {
      "uid": "pan-vault",
      "title": "pan-vault",
      "tags": ["pan-vault", "pci"],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "time": { "from": "now-1h", "to": "now" },
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "pan-vault up",
          "gridPos": { "x": 0, "y": 0, "w": 6, "h": 6 },
          "targets": [{ "refId": "A", "expr": "max(up{job=\"pan-vault\"})" }],
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false }
          },
          "fieldConfig": {
            "defaults": {
              "mappings": [
                { "type": "value", "options": { "0": { "text": "DOWN" }, "1": { "text": "UP" } } }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [{ "color": "red", "value": null }, { "color": "green", "value": 1 }]
              }
            },
            "overrides": []
          }
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "SAD rejections per minute",
          "description": "Requests rejected because the payload carried CVV, PIN or track data. Any value above zero is an integration error or an attack.",
          "gridPos": { "x": 6, "y": 0, "w": 18, "h": 6 },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(rate(panvault_sad_rejections_total[5m])) * 60",
              "legendFormat": "rejections/min"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "none", "min": 0 }, "overrides": [] }
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "Requests per second by status",
          "gridPos": { "x": 0, "y": 6, "w": 12, "h": 8 },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (http_response_status_code) (rate(http_server_request_duration_seconds_count{job=\"pan-vault\"}[5m]))",
              "legendFormat": "{{http_response_status_code}}"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "reqps", "min": 0 }, "overrides": [] }
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "p95 latency",
          "gridPos": { "x": 12, "y": 6, "w": 12, "h": 8 },
          "targets": [
            {
              "refId": "A",
              "expr": "histogram_quantile(0.95, sum by (le) (rate(http_server_request_duration_seconds_bucket{job=\"pan-vault\"}[5m])))",
              "legendFormat": "p95"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "s", "min": 0 }, "overrides": [] }
        }
      ]
    }
